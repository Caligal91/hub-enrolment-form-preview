<!doctype html>
<html lang="en"><head>

<title>Learning Support Specialist (LSS) | Pioneers Tutoring</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--brand:#F47A1F;--brand-dark:#E0690F;--b50:#FFF6EF;--b100:#FFE9D6;--ink:#1F1A17;--muted:#6B625B}
*{box-sizing:border-box}body{margin:0;font-family:Outfit,system-ui,sans-serif;color:var(--ink);background:var(--b50)}
h1,h2,h3,.btn{font-family:Poppins,system-ui,sans-serif}
.banner{background:var(--ink);color:#fff;text-align:center;font-size:13px;padding:8px 12px}
.wrap{max-width:520px;margin:0 auto;padding:16px 12px 40px}
.card{background:#fff;border-radius:24px;padding:28px;box-shadow:0 25px 50px -12px rgba(0,0,0,.18)}
.top{display:flex;align-items:center;gap:10px}.bar{flex:1;height:6px;border-radius:99px;background:var(--b100)}
.bar>i{display:block;height:6px;border-radius:99px;background:var(--brand);transition:width .3s}
.top span{font-size:12px;color:var(--muted);font-weight:500}
.logo{font:700 15px Poppins;margin:0 0 18px}.logo b{color:var(--brand)}
h2{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:20px 0 6px}
h3{font-size:21px;font-weight:700;line-height:1.3;letter-spacing:-.01em;margin:22px 0 4px}
p{color:var(--muted);font-size:15px;line-height:1.55;margin:6px 0}
.pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:99px;padding:6px 14px;font:600 13px Outfit;color:#C4560A;box-shadow:inset 0 0 0 1px var(--b100)}
.pill:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--brand)}
input[type=text],input[type=email],input[type=tel],input[type=date],textarea,select{width:100%;border:0;border-radius:16px;padding:14px 16px;font:600 17px Outfit;color:var(--ink);background:#fff;box-shadow:inset 0 0 0 1px var(--b100);margin-top:4px;outline:none;-webkit-appearance:none;appearance:none}
textarea{font-weight:500;resize:vertical}
input:focus,textarea:focus,select:focus{box-shadow:inset 0 0 0 2px var(--brand)}
.lab{font-size:13px;color:var(--muted);margin-top:16px;display:block;font-weight:500}
.help{font-size:12px;color:var(--muted);margin-top:4px}
.addr{position:relative}
.addr .list{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border-radius:16px;box-shadow:0 12px 30px -8px rgba(0,0,0,.25),inset 0 0 0 1px var(--b100);z-index:20;overflow:hidden}
.addr .list button{display:block;width:100%;text-align:left;border:0;background:#fff;padding:12px 16px;font:500 15px Outfit;color:var(--ink);cursor:pointer;border-bottom:1px solid var(--b50)}
.addr .list button:last-child{border-bottom:0}.addr .list button:hover,.addr .list button:focus{background:var(--b50);outline:0}
.addr .list .none{padding:12px 16px;font-size:14px;color:var(--muted)}
.addr .link{background:none;border:0;padding:0;margin-top:6px;color:var(--brand-dark);font:600 13px Outfit;cursor:pointer;text-decoration:underline}
.pre{display:inline-block;background:var(--b50);color:#C4560A;font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;margin-left:6px}
.btn{margin-top:24px;width:100%;border:0;border-radius:999px;background:var(--brand);color:#fff;font-weight:600;font-size:16px;padding:16px 24px;height:56px;box-shadow:0 10px 24px -8px rgba(244,122,31,.8);cursor:pointer}
.btn:hover{background:var(--brand-dark)}.btn:disabled{opacity:.4;box-shadow:none;cursor:not-allowed}
.back{background:none;border:0;color:var(--muted);font:500 14px Outfit;margin-top:12px;cursor:pointer;width:100%}
.opts{display:grid;gap:10px;margin-top:6px}
.opt{border:0;text-align:left;border-radius:16px;padding:14px 16px;font:500 16px Outfit;background:#fff;box-shadow:inset 0 0 0 1px var(--b100);cursor:pointer;color:var(--ink)}
.opt small{display:block;color:var(--muted);font-size:13px;font-weight:400;margin-top:2px}
.opt.on{box-shadow:inset 0 0 0 2px var(--brand);background:var(--b50);font-weight:600}
.opts.cols{grid-template-columns:repeat(3,1fr)}
.opt.box{text-align:center;padding:14px 6px}.opt.box b{display:block;font:600 16px Poppins}
.opt.box .pr{display:block;font-size:14px;font-weight:600;margin-top:4px}.opt.box small{font-size:11px}
.grp{margin-top:16px;font:600 15px Poppins}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--b100);font-size:15px}.row span:first-child{color:var(--muted)}.row b{text-align:right;font-weight:600;max-width:60%;word-break:break-word}
.chk{display:flex;gap:12px;align-items:flex-start;margin-top:16px;font-size:15px;line-height:1.5;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--brand);margin-top:2px;flex:none}
canvas{width:100%;height:170px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 1px var(--b100);margin-top:10px;touch-action:none;display:block}
.sig-note{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:8px}
.link{color:var(--brand-dark);background:none;border:0;font:600 13px Outfit;cursor:pointer;padding:0}
.keypts{background:#f7f3ee;border-radius:16px;padding:14px 16px;margin:12px 0}.keypts h4{margin:0 0 6px;font:600 15px Poppins;color:var(--ink)}.keypts ul{margin:0;padding-left:18px}.keypts li{font-size:14px;margin:6px 0;line-height:1.45;color:#3b332d}.keypts .keynote{font-size:12px;color:#777;margin:8px 0 0}
.tick{width:72px;height:72px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:38px;margin:10px auto 0}
.terms{max-height:300px;overflow:auto;border-radius:16px;box-shadow:inset 0 0 0 1px var(--b100);padding:12px 14px;font-size:13px;color:#4a423c;margin-top:10px;line-height:1.5}
.terms h4{margin:12px 0 4px;font:600 13px Poppins;color:var(--ink)}.terms p{font-size:13px;margin:4px 0}
.slotday{margin-top:12px;font-weight:600;font-size:14px}.slots{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.slot{border:0;border-radius:99px;padding:8px 12px;font:500 13px Outfit;background:#fff;box-shadow:inset 0 0 0 1px var(--b100);cursor:pointer;color:var(--ink)}
.slot.on{background:var(--brand);color:#fff}
.err{color:#b3261e;font-size:14px;margin-top:12px;min-height:18px}
.fade{animation:f .25s ease}@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
noscript{display:block;padding:20px;text-align:center}
</style></head><body>

essions a week","short":"6 months","price":"$245 per week"},{"value":"3x3","label":"3 sessions a week, 3 months","desc":"$260 per week","group":"3 sessions a week","short":"3 months","price":"$260 per week"},{"value":"2x12","label":"2 sessions a week, 12 months","desc":"$155 per week","group":"2 sessions a week","short":"12 months","price":"$155 per week"},{"value":"2x6","label":"2 sessions a week, 6 months","desc":"$165 per week","group":"2 sessions a week","short":"6 months","price":"$165 per week"},{"value":"2x3","label":"2 sessions a week, 3 months","desc":"$175 per week","group":"2 sessions a week","short":"3 months","price":"$175 per week"},{"value":"1x12","label":"1 session a week, 12 months","desc":"$80 per session","group":"1 session a week","short":"12 months","price":"$80 per session"},{"value":"1x6","label":"1 session a week, 6 months","desc":"$85 per session","group":"1 session a week","short":"6 months","price":"$85 per session"},{"value":"1x3","label":"1 session a week, 3 months","desc":"$90 per session","group":"1 session a week","short":"3 months","price":"$90 per session"}]},{"key":"dd_frequency","label":"Direct debit frequency","type":"radio","required":true,"showIf":{"pay_method":["Direct debit"]},"options":[{"value":"Weekly","label":"Weekly"},{"value":"Fortnightly","label":"Fortnightly"}]},{"key":"dd_day","label":"Preferred debit day","type":"select","required":true,"showIf":{"pay_method":["Direct debit"]},"options":[{"value":"Monday","label":"Monday"},{"value":"Tuesday","label":"Tuesday"},{"value":"Wednesday","label":"Wednesday"},{"value":"Thursday","label":"Thursday"},{"value":"Friday","label":"Friday"},{"value":"Saturday","label":"Saturday"},{"value":"Sunday","label":"Sunday"}]}]},{"id":"addons","title":"Assessment and extras","intro":"The $499 initial assessment, personalised plan and written report is part of every package, and is already included if you pay upfront. These extras are optional.","fields":[{"key":"flex_pay","label":"","type": label":"Anything else we should know?","type":"textarea"}]},{"id":"terms","title":"Terms and conditions","intro":"Please read these. You can scroll through them below.","fields":[{"key":"keypoints_dd","type":"keypoints","title":"The main points","showIf":{"pay_method":["Direct debit"]},"items":["You commit to the term you choose (3, 6 or 12 months) and complete all the sessions in it.","After your term, sessions continue until you cancel. To cancel you need to give 4 weeks' written notice, and those last 4 weeks are still charged.","Missed a session? Tell us at least 7 days ahead and you are not charged. With less notice, or a no-show, the session is charged. Illness or injury (with a medical certificate) or a family emergency is the exception. Please let us know as soon as you know.","You can pause up to 2 times a year, for up to 2 weeks each time, with 2 weeks' notice.","We run 50 weeks a year. There is a 2-week break over Christmas, and no sessions on Australia Day, Good Friday, Easter Monday or Anzac Day.","The $95 enrolment fee confirms your booking. Packages are non-refundable, but unused sessions can be credited or passed to a family member or friend.","You have a 3 business day cooling-off period after signing."]},{"key":"keypoints_up","type":"keypoints","title":"The main points","showIf":{"pay_method":["Upfront"]},"items":["You commit to the term you choose (3, 6 or 12 months) and complete all the sessions in it.","The 4-week cancellation notice does not apply to upfront payments. Instead, tell us in writing at least 7 days before your renewal whether you want to continue or cancel. If we do not hear from you, we assume you want to continue.","Missed a session? Tell us at least 7 days ahead and you are not charged. With less notice, or a no-show, the session is charged. Illness or injury (with a medical certificate) or a family emergency is the exception. Please let us know as soon as you know.","You can pause up to 2 times a year, for up to 2 weeks each time, with 2 weeks' notice.","We run 50 weeks a year. There is a 2-week break over Christmas, and no sessions on Australia Day, Good Friday, Easter Monday or Anzac Day.","The $95 enrolment fee confirms your booking. Packages are non-refundable, but unused sessions can be credited or passed to a family member or friend.","You have a 3 business day cooling-off period after signing."]},{"key":"terms_text","type":"terms","terms":[{"heading":"Cancellations & Suspensions Of Service","items":["1. Notice period","1.1 To ensure the best results, this contract includes a lock-in period covering the sessions you choose for a total of 13 weeks, 6 months or 12 months. The agreement is based on the total number of sessions scheduled for that period (e.g. a 13-week period at 2 x 30-min sessions = 26 sessions). During the chosen commitment period the agreement cannot be terminated until all scheduled sessions are completed.","1.2 After the chosen lock-in period, services continue until written notice to cancel is received, at which point a four-week notice period applies (2 billing cycles for fortnightly payments, or 4 billing cycles for weekly payments). The notice period begins on the first date you notify us in writing of your intent to cancel and ends after those payments have settled.","In plain language You commit for the term you pick (3, 6 or 12 months) and complete all sessions in it. After that, we keep going until you tell us to stop. Cancelling needs 4 weeks’ written notice - and those final 4 weeks are still charged.","1.3 For upfront payments, the four-week notice period in clause 1.2 does not apply. Instead, clients must advise Pioneers in writing at least seven (7) days before renewal whether they wish to continue or cancel. Otherwise, it is assumed the client wishes to continue.","1.4 If the period opted for includes a discount, after the chosen lock-in period, services continue at full price unless the client signs a new contract for a further lock-in period.","1.5 Direct debit: if the client cancels before the end of the agreed term, the client remains responsible for payment of all sessions scheduled within the selected lock-in period (3, 6 or 12 months) unless otherwise agreed by Pioneers. Exceptions may only be considered under extraordinary circumstances and at the sole discretion of Pioneers Tutoring.","1.6 Pioneers Tutoring operates 50 weeks each year, with a 2-week break during the Term Four school holidays (21 December to 4 January). We do not operate on the following public holidays: 26 January (Australia Day), Good Friday, Easter Monday, and 25 April (Anzac Day).","1.7 A cancellation notice period cannot commence while services are suspended. Suspension will be lifted to allow the billing cycles relevant within the notice period.","1.8 You can suspend services up to two times per calendar year (other than the mandatory two-week Christmas period) for up to 2 weeks at a time, with 2 weeks’ notice, if your account is up to date. The notice period starts from the first date you notify us in writing of your intent to suspend. If your account is not up to date, this must be settled within your suspension period.","(a) You can give us written notice (cancellation/suspension) by e-mail (tutor@pioneerstutoring.com). You must complete any standard documentation we may have, such as a form; your notice must include your name, phone, and the reason you wish to suspend.","1.9 In the event of illness/injury that prevents the student from engaging in tutoring services, you may suspend/cancel your contract immediately (medical report must be provided)."]},{"heading":"Cancellation Of Session By Client / Student","items":["1. Scheduling","1.1 In the event the student cannot attend an upcoming session, the client must contact Pioneers by phone or email (tutor@pioneerstutoring.com.au or 1800 272 344 – Option 2) as soon as possible, but not later than 7 days before the scheduled session. All reasonable circumstances are handled case-by-case. Students who are not present and have not provided the relevant notice (7 days) are considered No-Shows, and the client is still responsible for payment of the session. Repetitive late cancellations and/or No-Shows will result in termination of tutoring services.","1.2 In the event of illness or injury resulting in the student being unable to attend, relevant notice is reduced to when the parent first becomes aware. A medical certificate must be provided for the missed date to be considered relevant notice.","1.3 To avoid students missing planned lessons in their learning program, a no-show exception may only be granted a maximum of two (2) times per term (13 weeks).","1.4 If a session is missed with relevant notice (7 days), a future payment will not be charged.","1.5 If the student misses more than three consecutive scheduled sessions without providing notice, Pioneers reserves the right to cancel all future sessions and terminate services.","1.6 “Session” refers to a scheduled tutoring appointment of the duration specified at enrolment.","In plain language Need to miss a session? Tell us at least 7 days ahead and you won’t be charged. Less than 7 days’ notice (or a no-show) is still charged, unless it’s illness/injury with a medical certificate."]},{"heading":"Cancellation Of Session By Tutor","items":["2. Scheduling","2.1 If Pioneers is unable to attend an upcoming session, Pioneers will contact the client/student using the number(s) provided as soon as possible, but not later than 48 hours before the scheduled session except in emergencies. The next scheduled payment will not be charged for the missed session.","2.2 In the unlikely event that your child’s usual tutor changes, Pioneers will contact you using the number(s) provided as soon as possible. The change will not be made without the new tutor being made aware of the student’s learning plan and goals."]},{"heading":"Late To A Session","items":["3.3 If a student arrives late, the student is responsible for paying the full amount for the agreed time period, even if the session must be cut short as a result. At the tutor’s sole discretion, sessions may continue past the original end-time to accommodate the student where possible, up to the original session length. If the tutor is late, the tutor will stay back for the full time allotted. If Pioneers has not received notification of lateness, the tutor will keep the session open for 10 minutes, after which the session is terminated and charged as a no-show."]},{"heading":"Fees Payable To Pioneers","items":["3. Declined or failed payments","3.1 If you miss a scheduled payment, our debiting agent will attempt to debit the funds over the next few days. If your account becomes overdue we will endeavour to contact you via phone, SMS and/or email to arrange settlement.","3.2 You will be charged a Dishonour Fee of $15.00 if your financial institution dishonours a direct debit payment.","3.3 If we are unable to reach you or have the overdue account settled, as a last resort we may refer your overdue account to a collection agency; this may affect your credit score/rating. You will be liable for any additional costs incurred.","3.4 Any applicable fees for setting up and maintaining direct debit payments are outlined and agreed to when signing the direct debit authority."]},{"heading":"Non-Engagement Of Tutors","items":["5. To protect the integrity of our services, intellectual property, and the livelihood of our team, the Client agrees not to directly approach, solicit, engage, or employ any tutor, educator, contractor, or staff member introduced through Pioneers Tutoring/Speech other than through the Company during the service period and for twelve (12) months after termination or completion of services. This restriction includes but is not limited to:","○ engaging the tutor privately for tutoring services;","○ arranging lessons outside the Pioneers Tutoring/Speech platform;","○ referring the tutor to another family or third party for private tutoring;","○ facilitating private arrangements between the tutor and any other student or family;","○ offering employment or contracting opportunities directly to the tutor. If the Client directly or indirectly engages a tutor introduced through Pioneers Tutoring/Speech without prior written consent, the Client agrees to pay a placement fee equal to six (6) months of the tutor’s most recent remuneration through Pioneers Tutoring/Speech. This fee is payable within fourteen (14) days of written demand.","4.6 For privacy and safety reasons, clients must not attempt to obtain or use the personal contact details of any tutor introduced by Pioneers Tutoring/Speech, or contact them directly outside scheduled sessions arranged through the Company. All communication with tutors must be made through the Company’s approved channels. Any breach may result in immediate termination of services and applicable fees under the Non-Engagement of Tutors clause."]},{"heading":"Payment","items":["4. An enrolment fee of $95.00 will be made to confirm the booking.","4.1 Membership fees are paid in advance, either by invoice, weekly or fortnightly, by direct debit from a nominated bank account or credit card.","4.2 Payment method for future sessions: unless otherwise advised, the payment method used to process the $95.00 enrolment fee will be used for all ongoing direct debit or upfront payments for future sessions.","4.3 Commitment Packages are non-refundable and the lock-in period reflects what is selected on this form. Unused sessions in a prepaid package may be credited toward future services or transferred to a family member or friend, but will not be refunded.","4.4 You must notify us of any change to your bank account or credit card details 72 hours prior to your next debit.","4.5 Overcharges identified within two months after cancellation will be credited to the client’s account. Credits can be transferred to friends or family or applied to future services.","4.6 Overcharges identified beyond the two-month period will not be eligible for a refund or credit."]},{"heading":"Complaints","items":["5. In the unlikely event you are dissatisfied with a service, please notify the company in writing within 24 hours of the session so we can address your concerns and work towards a suitable resolution.","5.1 After reviewing the concern, you will be notified of the outcome and any proposed resolutions within 10 business days of submitting your complaint, unless additional time is required for complex cases. Resolutions may include a replacement session, credit, or adjustments to services, at the company’s discretion. No refunds will be provided. If dissatisfied with the outcome, you may request an internal review by a senior staff member.","5.2 Refund requests related to exceptional circumstances, such as medical emergencies, will be reviewed case-by-case. Documentation may be required."]},{"heading":"Recording Sessions","items":["1. Pioneers may sometimes propose video recording sessions for clinical supervision, training, or quality assurance. We will only record with your specific written consent for each occasion, requested in advance by email. Recordings are used internally only and deleted within one month. You may decline any recording at any time without affecting your services.","2. Pioneers uses Zoom AI Companion during Zoom sessions to support the accuracy and efficiency of session documentation. Sessions are not video recorded. Audio is transcribed in real time using Zoom’s AI Companion; the resulting written transcript is used by the tutor to support clinical session notes and is then deleted from our Zoom account within 14 business days. Zoom has confirmed that customer audio, video, chat and other content is not used to train its AI models. Some processing may occur on Zoom’s global infrastructure, including in the United States. By signing this agreement you consent to the use of AI transcription as described. You may withdraw this consent at any time in writing, and Pioneers will continue providing services without transcription.","3. Pioneers may utilise secure AI-assisted tools to support administrative efficiency and clinical documentation. Any AI-generated documentation is reviewed and approved by the tutor prior to finalisation. No identifying participant information is entered into AI-assisted systems. By signing this agreement you consent to the use of these systems as described. Consent may be withdrawn at any time in writing without affecting ongoing services."]},{"heading":"Privacy Declaration","items":["6. I, the undersigned parent or legal guardian of the student, authorise Pioneers to discuss and exchange information regarding my child’s educational needs with relevant professionals involved in the student’s education or care (including schools and doctors) to facilitate educational support. This consent covers the sharing of academic records, behavioural reports, and assessments, ensuring confidentiality, and is valid during my child’s enrolment with Pioneers. Consent can be withdrawn at any time in writing.","7.1 I acknowledge that phone calls made through Pioneers’ systems may be recorded for quality assurance, training, and record-keeping purposes. I understand that I may request for a call not to be recorded at the time of the call, and such requests will be respected."]},{"heading":"Cooling Off Period","items":["7. The Buyer acknowledges and understands that they have a Cooling Off Period of 3 business days from the date of signing this Contract (“Commencement Date”) to reconsider their decision without any penalty or obligation.","8. During the Cooling Off Period, the Buyer has the right to terminate this Contract by providing written notice of termination to the Seller (registered mail, email, or text message)."]},{"heading":"Advice","items":["9. The Buyer acknowledges that they have been provided with information and advice regarding our tutoring services.","9.1 The Buyer understands that our tutoring services focus on literacy intervention with the aim to provide academic assistance, support, and guidance to improve the student’s knowledge and understanding of the chosen subject(s).","9.3 The Buyer understands that the tutor will make reasonable efforts to customise sessions to address the student’s specific needs and learning style, within the scope of the chosen subject(s) and available resources."]},{"heading":"Limitation Of Liability","items":["11.0 Pioneers provides educational tutoring services designed to support students in developing literacy, learning skills, confidence, and academic understanding. While Pioneers strives to deliver high-quality support, individual progress may vary depending on the student’s engagement, attendance, effort, practice outside sessions, and other external circumstances.","11.1 To the maximum extent permitted by law, Pioneers shall not be liable for any indirect, incidental, special, or consequential loss or damage arising from or related to the tutoring services provided, including but not limited to loss of academic progress, examination results, school performance, missed opportunities, or other educational outcomes.","11.2 Pioneers does not guarantee specific academic results, grades, reading levels, or learning outcomes. The Client acknowledges that progress may vary between students and that the absence of immediate or expected progress does not constitute a failure to provide services.","11.4 To the extent permitted by law, the total liability of Pioneers, whether in contract, negligence, or otherwise, shall be limited to the total amount of fees paid by the Client for tutoring services in the twelve (12) weeks preceding the event giving rise to the claim.","11.5 Nothing in this Agreement limits or excludes any rights or guarantees that cannot be excluded under the Australian Consumer Law."]},{"heading":"Indemnity","items":["12. The Client agrees to indemnify and hold harmless Pioneers, its directors, employees, contractors, and representatives from any claims, damages, losses, costs, or liabilities including but not limited to arising from:","○ misuse of materials, programs, or resources provided by Pioneers;","○ failure by the Client to provide accurate information about the Student’s learning needs or circumstances;","○ failure by the Client to appropriately supervise the Student during sessions;","○ breach of this Service Agreement by the Client or Student.","○ the student’s participation in sessions;","○ reliance on advice, strategies, or recommendations provided during sessions;","○ any third-party claim arising from the student’s actions, behaviour or performance. This indemnity survives the termination of this Agreement."]},{"heading":"Online Session Responsibility","items":["13. The Client acknowledges that tutoring services are delivered online using digital platforms and that participation requires appropriate technology and internet access.","13.1 The Client is responsible for ensuring that the Student has access to a stable internet connection, a functioning device capable of supporting the required software or platforms, and any learning materials required for participation.","13.2 Pioneers will not be responsible for interruptions, delays, or inability to deliver sessions caused by internet or power outages, software, platform or device failure, or other technical issues outside of Pioneers’ control, including disruptions to third-party video-conferencing platforms such as Zoom, Microsoft Teams, or similar services.","13.3 Where a session is significantly disrupted or cannot proceed due to technical issues, Pioneers may, at its discretion, reschedule the session or provide a credit. Where repeated technical issues occur on the Client’s side and significantly impact service delivery, Pioneers may require sessions to be rescheduled or paused until the issue is resolved."]},{"heading":"Supervision Of Students","items":["15. Parents/Guardians acknowledge that tutoring sessions delivered online do not provide physical supervision of students.","15.1 The Parent/Guardian remains responsible for the supervision, safety, and wellbeing of the Student during all tutoring sessions.","15.2 Pioneers accepts no responsibility for incidents, injuries, or events that occur in the Student’s physical environment during or outside of online sessions.","15.3 The Client agrees to ensure that sessions take place in an appropriate learning environment free from excessive noise, disruption, or interference. Pioneers reserves the right to pause or reschedule sessions where the learning environment is unsuitable."]},{"heading":"Educational Advice Disclaimer","items":["16. Any advice, strategies, recommendations, feedback, or resources provided by Pioneers are based on the tutor’s professional experience and observations during tutoring sessions.","16.1 Such advice is intended as general educational guidance to support the student’s learning and academic development.","16.2 Advice provided during tutoring sessions should not be interpreted as a formal psychological, medical, or educational diagnosis.","16.3 Parents/Guardians remain responsible for seeking appropriate professional advice where specialised educational, psychological, or medical support may be required."]},{"heading":"Session Participation","items":["17. Students are expected to engage appropriately in tutoring sessions to the best of their ability.","17.1 Where a student repeatedly refuses to participate or behaves in a manner that prevents the session from proceeding effectively, Pioneers reserves the right to end the session early.","17.2 Where a session has commenced and is ended early due to refusal to participate, disruption, or failure to engage, the session may still be charged."]},{"heading":"Pricing Adjustment","items":["18. Pioneers reserves the right to adjust prices with 30 days’ written notice to the client. Price adjustments may reflect changes in market conditions, operating costs, or other factors deemed necessary by the Service Provider. If the Client continues to use the services after the effective date of the adjustment, the Client is deemed to have accepted the new prices.","18.1 Pioneers will not adjust prices more frequently than once every 6 months, except in extraordinary circumstances, such as significant increases in operational costs or regulatory changes.","18.2 If the Client does not agree to the adjusted prices, the Client may terminate this Agreement by providing written notice within 7 days of receiving the price adjustment notice. Termination under this clause is effective 4 weeks (under clause 1.2) from the date of the Client’s written termination notice."]},{"heading":"Rewards","items":["19.0 Student points are awarded after each session at a maximum of 40 points per hour session. Students can redeem points by submitting a form on our website: https://www.pioneerstutoring.com.au/rewards","19.1 Rewards will be sent (e-mailed or posted) within 14 days after the request has been submitted.","19.2 A maximum of 2 vouchers per student can be redeemed per term (13 weeks) using points.","19.3 Vouchers can only be claimed through submission of the online form on our website.","19.4 Upon cancellation, students have 14 days to redeem points, after which the point balance reduces to zero.","19.5 Rewards are only eligible for redemption if the account is up to date and free of outstanding balances."]},{"heading":"Force Majeure","items":["21.1 Pioneers Tutoring/Speech shall not be liable for any delay, suspension, or failure to provide services where caused by events beyond our reasonable control, including but not limited to natural disasters, fire, flood, pandemic, epidemic, public health emergency, government restrictions, industrial disputes, internet or power outages, or acts of God.","21.2 In such circumstances, services may be rescheduled, delivered in an alternative format (e.g. online), or temporarily suspended without penalty.","21.3 If the interruption continues for more than 30 days, either party may terminate this Agreement by written notice. In such cases, any unused prepaid fees will be credited toward future services but will not be refunded."]},{"heading":"Intellectual Property","items":["22.1 All lesson materials, resources, programs, assessments, session recordings, and documentation provided by Pioneers Tutoring/Speech remain the exclusive property of Pioneers Tutoring/Speech.","22.2 Such materials are provided solely for the enrolled student’s personal educational use during the program. They must not be copied, shared, published, sold, distributed, or used for any commercial or teaching purpose outside the agreed sessions without prior written consent from Pioneers Tutoring/Speech.","22.3 Any unauthorised use or distribution of our intellectual property will be considered a breach of this Agreement and may result in immediate termination of services and/or legal action. The Client agrees not to:","○ copy or reproduce materials;","○ distribute materials to third parties;","○ upload materials online;","○ use materials for commercial or tutoring purposes;","○ provide materials to other tutors, educators, businesses or the public.","22.4 Clients and Participants are not permitted to record, photograph, screen record, or otherwise capture any part of a session without the prior written consent of Pioneers Tutoring/Speech. This includes but is not limited to video recordings (including via a secondary device such as a phone or camera), audio recordings, screenshots, screen recordings, and sharing session links with unauthorised individuals.","22.5 Any unauthorised recording or distribution of sessions, teaching methods, materials, or staff interactions may result in the immediate termination of services without refund. This includes distribution through social media, messaging applications, or any online platform. The Client must immediately delete any recordings upon request and confirm deletion in writing. Where recordings are distributed publicly or shared with third parties, Pioneers Tutoring/Speech reserves the right to pursue legal remedies for breach of privacy and intellectual property rights. Where consent is granted for a recording, it must not be shared publicly or distributed to third parties without written permission from Pioneers Tutoring/Speech.","22.6 This clause is intended to protect the privacy, safety, and intellectual property of staff and Participants."]},{"heading":"Confidentiality","items":["23.1 All strategies, resources, assessment results, reports, and information provided by Pioneers Tutoring/Speech are confidential and intended solely for the use of the enrolled student and their Parent/Guardian.","23.2 The Parent/Guardian agrees not to disclose, share, copy, or distribute such information to any third party without the prior written consent of Pioneers Tutoring/Speech, except where disclosure is required by law.","23.3 Pioneers Tutoring/Speech will maintain the confidentiality of all student records and personal information in accordance with applicable privacy laws."]},{"heading":"Money-Back Guarantee","items":["Pioneers Tutoring – 13-Week Measurable Progress Guarantee At Pioneers Tutoring, we are confident in our ability to help students achieve measurable progress in their reading and spelling skills. That’s why we proudly offer our 13-Week Money-Back Guarantee. We are committed to providing every student with structured, individualised support tailored to their learning needs. To ensure fairness and transparency, our guarantee is subject to the following terms and conditions, which outline the responsibilities of both Pioneers Tutoring and participating families. Eligibility Requirements","20. The student must be at least six months behind their expected reading level, as determined by Pioneers Tutoring’s initial programming assessment.","20.1 The guarantee applies only to students enrolled in a program consisting of a minimum of two scheduled tutoring sessions per week over a 13-week period.","20.2 The student must be at least six years old and able to spell three-letter words at the commencement of the program. Attendance and Participation","20.3 The student must attend all scheduled tutoring sessions throughout the 13-week program. Where a family voluntarily withdraws from the program before completion, the money-back guarantee will no longer apply.","20.4 Sessions missed due to illness or unforeseen circumstances must be rescheduled and completed within the program period where reasonably possible. Where Pioneers Tutoring cancels a session, reasonable arrangements will be made to provide a replacement session without affecting the student’s eligibility for the guarantee.","20.5 The student must actively participate in tutoring sessions and complete assigned learning activities to the best of their ability. Parents or guardians must support the program by ensuring that homework and practice activities provided by the tutor are completed between sessions.","20.6 Parents or guardians must maintain regular communication with the tutor and attend scheduled progress meetings or feedback sessions where reasonably required. Assessment and Measurable Progress","20.7 The student must complete the initial assessment, any required progress assessments and the final post-program assessment. These assessments may measure reading accuracy, reading fluency, spelling and other relevant literacy skills. Assessments will be administered under consistent conditions using Pioneers Tutoring’s assessment procedures. Where an assessment cannot be completed as scheduled for a reasonable cause, Pioneers will arrange an appropriate alternative.","20.8 The money-back guarantee applies only where a student demonstrates no measurable progress in any of the literacy areas assessed during the 13-week program. Measurable progress is determined by comparing the student’s initial assessment results with their final post-program assessment results. Any positive improvement in at least one assessed literacy area, demonstrated by an increase in the student’s assessment score under the applicable scoring criteria, will constitute measurable progress for the purpose of this guarantee. Improvement across all assessed literacy areas is not required. Progress in one assessed area is sufficient to satisfy the measurable progress requirement.","20.9 Pioneers Tutoring’s assessment tools will be used to determine measurable progress for the purpose of this voluntary guarantee. These tools are aligned with the skills taught throughout the program and are administered consistently to allow for direct comparison. External assessments, school reports, NAPLAN results, professional opinions and observations from parents or teachers will not replace Pioneers’ assessment criteria when determining eligibility under this guarantee. Parents may request clarification of assessment results or raise concerns regarding assessment accuracy or administration. Nothing in this clause limits a family’s rights under the Australian Consumer Law. Circumstances That May Void the Guarantee","20.10 The money-back guarantee may become void where the student or family fails to meet the attendance, participation or assessment requirements outlined in these terms, including:","○ repeatedly missing scheduled sessions without reasonable cause or without making reasonable efforts to reschedule;","○ consistently failing to participate in tutoring activities or complete assigned practice tasks;","○ refusing to complete required assessments without reasonable justification; or","○ voluntarily withdrawing from the program before completing the required 13 weeks.","20.11 Tutors will document attendance, participation and assigned practice throughout the program. Where concerns arise regarding engagement, attendance or home practice, Pioneers Tutoring will notify the parent or guardian in writing and provide a reasonable opportunity to address the concerns before the guarantee is affected. Any decision to void the guarantee will take into account reasonable circumstances, including illness, disability-related needs and circumstances outside the family’s control.","20.12 External factors that materially interfere with the student’s ability to participate in or complete the program may affect eligibility for the guarantee. These factors may include additional tutoring programs, significant changes to the student’s learning arrangements or other circumstances that substantially interfere with program delivery or assessment. Such circumstances will be reviewed individually and will not automatically invalidate the guarantee. Refund Eligibility and Process","20.13 A refund under the money-back guarantee will only be available where:","○ the student has completed the required 13-week program;","○ the student has met the eligibility, attendance, participation and assessment requirements;","○ the final assessment demonstrates no positive improvement in any assessed literacy area; and","○ all other applicable conditions of the guarantee have been satisfied.","20.14 Requests for refunds must be submitted in writing to clientcare@pioneerstutoring.com.au within seven calendar days of completing the program. Pioneers Tutoring will review the student’s assessment results, attendance records, participation records and compliance with the guarantee conditions.","20.15 Pioneers Tutoring will acknowledge refund requests within three business days and aim to provide a written outcome within 14 business days of receiving all information reasonably required to assess the request. Where a refund is approved, payment will be processed within 10 business days of approval. Parents or guardians may request a review of a refund decision if they believe an error has occurred in the assessment or application of these terms.","20.16 Where a student qualifies for the money-back guarantee, Pioneers Tutoring will refund the eligible tuition fees paid for tutoring sessions delivered as part of the 13-week program. Any exclusions from the refund, including assessment fees or other separately charged services, must be clearly disclosed to the parent or guardian before enrolment. General Conditions","20.17 The money-back guarantee applies only to eligible students enrolled in the specified 13-week program and cannot be transferred to another student or program.","20.18 This guarantee applies only to Learning Support Specialist (LSS) tutoring sessions and does not apply to any other service offerings. This includes, but is not limited to, the initial assessment, language assessments (CELF-5), LSS Clinical, the C.Pen ReaderPen2™, the Complete Parent Teaching Course, speech pathology, developmental therapy and any other products or services provided by Pioneers Tutoring or Pioneers Speech.","20.19 The terms and conditions provided to the parent or guardian at the time of enrolment will apply for the duration of that student’s 13-week guarantee period.","20.20 Where any other clause in this Agreement states that fees are non-refundable, that no refunds will be provided, or that Pioneers does not guarantee results (including clauses 4.3, 5.1, 11.2, 21.3 and 24.4), that clause is subject to this Money-Back Guarantee.","20.21 The money-back guarantee is a voluntary commitment offered by Pioneers Tutoring and is in addition to, and does not exclude, restrict or modify, any rights or remedies available to consumers under the Australian Consumer Law. Nothing in these terms limits a consumer’s entitlement to a remedy for a failure to comply with applicable consumer guarantees, regardless of whether the requirements of this voluntary money-back guarantee have been met.","In plain language If your child is eligible, attends their sessions, does their practice and completes all assessments, and our final assessment shows no improvement in any area after 13 weeks, we’ll refund the tutoring session fees. The guarantee covers LSS tutoring sessions only – not assessments, upgrades or other products."]},{"heading":"Code Of Conduct / Respect","items":["24.1 Pioneers Tutoring/Speech is committed to providing a safe and respectful environment for students, families, and staff. Parents/Guardians and students are expected to communicate respectfully with all staff members at all times.","24.2 Abusive, aggressive, threatening, or disrespectful behaviour toward staff, whether verbal, written, or otherwise, will not be tolerated.","24.3 Parents/Guardians agree to cooperate with scheduling, administrative requirements, and reasonable requests necessary to deliver services effectively.","24.4 Pioneers Tutoring/Speech reserves the right to suspend or terminate services immediately if this Code of Conduct is breached. Where services are suspended or terminated due to a breach, the Client remains responsible for all fees payable under the remaining term of this Agreement, and no refunds, credits, or transfers will be provided for any unused sessions."]},{"heading":"Entire Agreement","items":["This Agreement is governed by and construed in accordance with the laws of the State of Victoria, Australia. You agree that we have not made any representations or promises that you have relied on that are not in this Agreement. Please read it fully to make sure it reflects your expectations. If you are unsure whether any particular statements you have relied on are part of this Agreement, or if you have any queries, please ask us before you sign. Pioneers reserves the right to modify, amend, or update its policies and procedures at any time. Any changes will be communicated to all relevant parties in a timely manner through appropriate channels, such as email or official company communications. It is the responsibility of each individual to stay informed about any updates. Your continued engagement with Pioneers following notification of any changes constitutes your acceptance of the revised policies and procedures."]}]},{"key":"ack_cancellation","type":"check","required":true,"checkLabel":"I understand the lock-in period for the term I chose, and that 4 weeks' written notice is needed to cancel after it (direct debit).","showIf":{"pay_method":["Direct debit"]}},{"key":"ack_renewal","type":"check","required":true,"checkLabel":"I understand I need to tell Pioneers in writing at least 7 days before my renewal if I want to cancel. There is no 4-week notice period for upfront payments.","showIf":{"pay_method":["Upfront"]}},{"key":"ack_terms","type":"check","required":true,"checkLabel":"I have read and agree to the Terms and Conditions (Part 3)."}]},{"id":"sign","title":"Sign","intro":"Type your name and sign with your finger or mouse. The date and time are saved automatically.","fields":[{"key":"signer_name","label":"Your full name","type":"text","required":true,"prefill":"parent.name"},{"key":"signature","type":"signature","required":true},{"key":"ack_esign","type":"check","required":true,"checkLabel":"I agree that my typed name and drawn signature are my legal electronic signature, and that I am legally bound by this agreement."}]}]},"prefill":{"student":{"name":"Sample Student"},"parent":{"name":"Sample Parent","phone":"0400 000 000","email":"parent@example.com"}},"answers":{"student_name":"Sample Student","student_dob":"2015-03-12","student_sex":"Female","student_address":"12 Smith Street, Parramatta NSW 2150","student_language":"English","student_grade":"Year 3","student_school":"Sample Public School","student_diagnosis":"None","parent_name":"Sample Parent","parent_relationship":"Mother","parent_phone":"0400 000 000","parent_email":"parent@example.com","parent_address_same":true,"pay_method":"Upfront","plan_upfront":"3x6","availability":["Monday 4:00-5:00 pm","Wednesday 4:00-5:00 pm","Friday 4:00-5:00 pm"],"comments":"Sample comment","ack_renewal":true,"ack_terms":true,"signer_name":"Sample Parent"},"isTest":true,"pack":null,"mapsKey":"demo","payPreview":"./"}</script>
<script>
(function () {
  var P = JSON.parse(document.getElementById('payload').textContent);
  var form = P.form, token = P.token;
  var card = document.getElementById('card');
  if (P.preview) { var sb = document.getElementById('stagingBanner'); sb.textContent = 'TEST PREVIEW of the real Learning Support Specialist form. Nothing you type is saved or sent. Address suggestions here are samples only.'; sb.style.display = 'block'; }
  else if (/staging/.test(location.hostname)) document.getElementById('stagingBanner').style.display = 'block';

  // ---- answers: defaults, then Hub pre-fill, then anything saved earlier
  var A = {}, pre = {}, addrManual = {};
  form.steps.forEach(function (s) { s.fields.forEach(function (f) {
    if (!f.key || f.type === 'info' || f.type === 'terms' || f.type === 'signature' || f.type === 'keypoints') return;
    if (f.type === 'check') A[f.key] = f.default === true;
    else if (f.type === 'availability') A[f.key] = [];
    else A[f.key] = '';
    if (f.prefill) {
      var parts = f.prefill.split('.'), v = P.prefill;
      for (var i = 0; i < parts.length && v; i++) v = v[parts[i]];
      if (typeof v === 'string' && v) { A[f.key] = v; pre[f.key] = true; }
    }
  }); });
  var saved = P.answers || {};
  Object.keys(saved).forEach(function (k) {
    if (k in A && saved[k] !== '' && saved[k] !== false && !(Array.isArray(saved[k]) && !saved[k].length)) { A[k] = saved[k]; }
  });

  function shown(f) {
    if (!f.showIf) return true;
    return Object.keys(f.showIf).every(function (k) {
      var v = A[k];
      return f.showIf[k].some(function (a) { return a === v || (a === false && (v === undefined || v === null || v === '')); });
    });
  }
  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  function escA(s) { return esc(s).replace(/"/g, '&quot;'); }

  // ---- screens
  var screens = [{ t: 'intro' }];
  form.steps.forEach(function (s) {
    if (s.id === 'terms') screens.push({ t: 'review' });
    screens.push({ t: 'step', step: s });
  });
  screens.push({ t: 'done' });
  var cur = 0, sigPng = null, strokes = 0, submitting = false, nextForm = null, payNext = null;
  var N = screens.length - 1; // not counting done

  function prog(i) { return '<div class="top"><div class="bar"><i style="width:' + Math.round((i / (N - 1)) * 100) + '%"></i></div><span>' + i + '/' + (N - 1) + '</span></div>'; }
  var logo = '<p class="logo" style="display:flex;align-items:center;gap:10px"><img src="logo.svg" alt="" style="height:34px"><span><b>Pioneers</b> Tutoring &amp; Speech</span></p>';

  function docHtml() {
    if (P.preview) return '<p class="help" style="margin-top:12px">The uploaded document shows here for the family.</p>';
    var u = '/enrol/' + token + '/doc';
    return '<div style="margin-top:12px"><a class="btn" style="display:block;text-align:center;line-height:24px;text-decoration:none;margin-top:8px;height:auto;padding:14px 20px;box-sizing:border-box" href="' + escA(u) + '" target="_blank" rel="noopener">Open the document &ldquo;' + esc(form.document.title) + '&rdquo;</a>' +
      '<p class="help" style="text-align:center">It opens in a new tab. Come back here when you have read it.</p>' +
      '<iframe src="' + escA(u) + '#view=FitH" title="' + escA(form.document.title) + '" style="width:100%;height:420px;border:0;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 1px var(--b100);margin-top:8px"></iframe></div>';
  }

  function fieldHtml(f) {
    if (!shown(f)) return '';
    var id = 'f_' + f.key, lab = f.label ? '<label class="lab" for="' + id + '">' + esc(f.label) + (pre[f.key] ? '<span class="pre">pre-filled</span>' : '') + (f.required ? '' : '') + '</label>' : '';
    var help = f.help ? '<div class="help">' + esc(f.help) + '</div>' : '';
    switch (f.type) {
      case 'text': case 'email': case 'tel': case 'date':
        return lab + '<input type="' + f.type + '" id="' + id + '" data-k="' + f.key + '" value="' + escA(A[f.key]) + '" autocomplete="off">' + help;
      case 'textarea':
        return lab + '<textarea rows="4" id="' + id + '" data-k="' + f.key + '">' + esc(A[f.key]) + '</textarea>' + help;
      case 'address':
        if (!P.mapsKey || addrManual[f.key])
          return lab + '<textarea rows="3" id="' + id + '" data-k="' + f.key + '" placeholder="Street number and name, suburb, state, postcode">' + esc(A[f.key]) + '</textarea>' +
            (P.mapsKey ? '<button type="button" class="link" data-am="' + f.key + '" data-to="0">Search for the address instead</button>' : '') + help;
        return lab + '<div class="addr"><input type="text" id="' + id + '" data-ak="' + f.key + '" value="' + escA(A[f.key]) + '" placeholder="Start typing the address" autocomplete="off" role="combobox" aria-expanded="false">' +
          '<div class="list" data-al="' + f.key + '" hidden></div></div>' +
          '<div class="help">Pick your address from the list.</div><button type="button" class="link" data-am="' + f.key + '" data-to="1">Can\'t find it? Type it in</button>' + help;
      case 'select':
        return lab + '<select id="' + id + '" data-k="' + f.key + '"><option value="">Choose...</option>' + f.options.map(function (o) { return '<option value="' + escA(o.value) + '"' + (A[f.key] === o.value ? ' selected' : '') + '>' + esc(o.label) + '</option>'; }).join('') + '</select>';
      case 'radio':
        if (f.grid) {
          var gs = [], gm = {};
          f.options.forEach(function (o) { var g = o.group || ''; if (!gm[g]) { gm[g] = []; gs.push(g); } gm[g].push(o); });
          return lab + gs.map(function (g) {
            return (g ? '<div class="grp">' + esc(g) + '</div>' : '') + '<div class="opts cols">' + gm[g].map(function (o) {
              return '<button type="button" class="opt box' + (A[f.key] === o.value ? ' on' : '') + '" data-r="' + f.key + '" data-v="' + escA(o.value) + '"><b>' + esc(o.short || o.label) + '</b>' +
                (o.price ? '<span class="pr">' + esc(o.price) + '</span>' : '') + ((o.sub || (!o.price && o.desc)) ? '<small>' + esc(o.sub || o.desc) + '</small>' : '') + '</button>';
            }).join('') + '</div>';
          }).join('') + help;
        }
        return lab + '<div class="opts">' + f.options.map(function (o) { return '<button type="button" class="opt' + (A[f.key] === o.value ? ' on' : '') + '" data-r="' + f.key + '" data-v="' + escA(o.value) + '">' + esc(o.label) + (o.desc ? '<small>' + esc(o.desc) + '</small>' : '') + '</button>'; }).join('') + '</div>';
      case 'check':
        return lab + '<label class="chk"><input type="checkbox" data-c="' + f.key + '"' + (A[f.key] ? ' checked' : '') + '><span>' + esc(f.checkLabel) + '</span></label>';
      case 'availability':
        return lab + '<div class="help">Tap to choose. Picked: <b id="availCount">' + (A[f.key] || []).length + '</b> (need at least ' + (f.min || 1) + ')</div>' + f.days.map(function (d) {
          return '<div class="slotday">' + esc(d.day) + '</div><div class="slots">' + d.slots.map(function (sl) {
            var v = d.day + ' ' + sl; return '<button type="button" class="slot' + (A[f.key].indexOf(v) >= 0 ? ' on' : '') + '" data-a="' + f.key + '" data-v="' + escA(v) + '">' + esc(sl) + '</button>';
          }).join('') + '</div>';
        }).join('');
      case 'info':
        return '<div style="margin-top:12px">' + (f.rows || []).map(function (r) { return '<div class="row"><span>' + esc(r[0]) + '</span><b>' + esc(r[1]) + '</b></div>'; }).join('') + '</div>';
      case 'keypoints':
        return '<div class="keypts"><h4>' + esc(f.title || 'The main points') + '</h4><ul>' + (f.items || []).map(function (it) { return '<li>' + esc(it) + '</li>'; }).join('') + '</ul><p class="keynote">The full terms are below.</p></div>';
      case 'terms':
        return '<div class="terms" id="terms">' + f.terms.map(function (sec) { return '<h4>' + esc(sec.heading) + '</h4>' + sec.items.map(function (it) { return '<p>' + esc(it) + '</p>'; }).join(''); }).join('') + '</div>';
      case 'signature':
        return '<label class="lab">Sign here</label><canvas id="cv"></canvas><div class="sig-note"><span id="when"></span><button type="button" class="link" id="clr">Clear</button></div>';
    }
    return '';
  }

  function stepErrors(step) {
    var errs = [];
    step.fields.forEach(function (f) {
      if (!f.required || !shown(f) || !f.key) return;
      if (f.type === 'signature') { if (strokes < 8) errs.push('Please sign in the box.'); return; }
      var v = A[f.key];
      if (f.type === 'check' ? v !== true : f.type === 'availability' ? (v || []).length < (f.min || 1) : !String(v || '').trim()) {
        errs.push(f.type === 'check' ? 'Please tick the box to continue.' : f.type === 'availability' ? 'Please choose at least ' + (f.min || 1) + ' times.' : (f.label || 'This') + ' is required.');
      }
      if (f.type === 'email' && v && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) errs.push('That email looks wrong.');
    });
    return errs;
  }

  function reviewRows() {
    var out = [];
    form.steps.forEach(function (s) {
      if (s.id === 'terms' || s.id === 'sign' || s.id === 'fees' || s.id === 'history') return;
      s.fields.forEach(function (f) {
        if (!f.key || !shown(f) || ['info', 'terms', 'signature', 'availability', 'keypoints'].indexOf(f.type) >= 0) return;
        var v = A[f.key];
        if (f.type === 'check') { if (!v) return; v = 'Yes'; }
        else if (f.options && v) { var o = f.options.filter(function (x) { return x.value === v; })[0]; if (o) v = o.label; }
        if (!v) return;
        out.push([f.label || f.checkLabel, v]);
      });
    });
    return out;
  }

  function render(keep) {
    var y = window.pageYOffset || 0, sc = screens[cur], h = '';
    if (sc.t === 'intro') {
      h = logo + '<span class="pill">' + esc(form.title) + (P.pack ? ' &middot; form ' + P.pack.position + ' of ' + P.pack.total : '') + '</span><h2>We are so excited you have decided to start with us!</h2><p class="welcome">Thank you for choosing Pioneers. We can\'t wait to get ' + (P.prefill.student && P.prefill.student.name ? esc(P.prefill.student.name.split(' ')[0]) : 'your child') + ' started. This form takes a few minutes and gets everything ready for your first session.</p><p>A few quick questions, a screen at a time. We have filled in what we already know, so please check it. Your answers save as you go, so you can come back to this link.</p><button class="btn" id="next">Start &rarr;</button>';
    } else if (sc.t === 'review') {
      h = logo + prog(cur) + '<h3>Quick check</h3><p>Here is what you have told us. Go back if anything is wrong.</p>' + reviewRows().map(function (r) { return '<div class="row"><span>' + esc(r[0]) + '</span><b>' + esc(r[1]) + '</b></div>'; }).join('') + '<button class="btn" id="next">Looks right &rarr;</button><button class="back" id="back">Back</button>';
    } else if (sc.t === 'step') {
      var s = sc.step, last = s.id === 'sign';
      h = logo + prog(cur) + '<h3>' + esc(s.title) + '</h3>' + (s.intro ? '<p>' + esc(s.intro) + '</p>' : '') + (s.id === 'document' && form.document ? docHtml() : '') + s.fields.map(fieldHtml).join('') + '<div class="err" id="err"></div><button class="btn" id="next">' + (last ? 'Sign and finish' : 'Next &rarr;') + '</button><button class="back" id="back">Back</button>';
    } else if (payNext) {
      h = logo + '<div class="tick">&#10003;</div><h2 style="text-align:center">Thank you, we are super excited!</h2><p style="text-align:center">Your enrolment is signed. Welcome to the Pioneers family. The next step is to set up your payments.</p><a class="btn" style="display:block;text-align:center;line-height:24px;text-decoration:none;box-sizing:border-box" href="' + escA(payNext) + '">Set up payments &rarr;</a><p style="text-align:center;font-size:13px;color:#777">Taking you to the payment page in a few seconds.</p>';
    } else if (nextForm) {
      h = logo + '<div class="tick">&#10003;</div><h2 style="text-align:center">Thank you, that one is signed</h2><p style="text-align:center">We have kept your details, so the next form is already filled in for you. ' + (nextForm.title ? 'Next: <b>' + esc(nextForm.title) + '</b>.' : '') + '</p><a class="btn" style="display:block;text-align:center;line-height:24px;text-decoration:none;box-sizing:border-box" href="' + escA(nextForm.url) + '">Continue to the next form &rarr;</a><p style="text-align:center;font-size:13px;color:#777">Taking you there in a few seconds.</p>';
    } else {
      h = logo + '<div class="tick">&#10003;</div><h2 style="text-align:center">All done, thank you!</h2><p style="text-align:center">Your enrolment is signed and we have your details. Someone from Pioneers will be in touch to book the first session. If you have questions, call 1800 272 344.</p>';
    }
    card.innerHTML = '<div' + (keep ? '' : ' class="fade"') + '>' + h + '</div>';
    wire();
    window.scrollTo(0, keep ? y : 0); // ticking a box or picking an option stays where you are; changing screen goes to the top
  }

  function stepInfo() {
    var sc = screens[cur] || {}, total = screens.length;
    var title = sc.t === 'intro' ? 'Opened the form' : sc.t === 'review' ? 'Quick check' : sc.t === 'done' ? 'Finished' : (sc.step && sc.step.title) || '';
    return { no: cur + 1, total: total, title: title };
  }
  var saveTimer = null;
  function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 1500); }

  function save() {
    if (P.preview) return;
    try {
      fetch('/enrol/' + token + '/save', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'payload=' + encodeURIComponent(JSON.stringify({ answers: A, step: stepInfo() })) });
    } catch (e) {}
  }

  // ---- address search (Google Places, Australia only). Falls back to typing it in.
  var addrToken = null;
  function newToken() { return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2); }
  var DEMO_ADDR = ['12 Smith Street, Fitzroy VIC 3065', '12 Smithfield Road, Edensor Park NSW 2176', '45 Smith Avenue, Newstead QLD 4006', '7 Smithton Court, Mount Barker SA 5251'];
  function fetchAddr(q, cb) {
    if (P.mapsKey === 'demo') { var lq = q.toLowerCase(); return cb(null, DEMO_ADDR.filter(function (a) { return a.toLowerCase().indexOf(lq) >= 0 || /^\d*\s*smi/.test(lq); })); }
    if (P.mapsKey === 'server') {
      return fetch('/enrol/' + token + '/address?q=' + encodeURIComponent(q), { credentials: 'same-origin' })
        .then(function (r) { if (!r.ok) throw new Error('addr ' + r.status); return r.json(); })
        .then(function (d) { cb(null, d.items || []); }).catch(function (e) { cb(e); });
    }
    if (!addrToken) addrToken = newToken();
    fetch('https://places.googleapis.com/v1/places:autocomplete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Goog-Api-Key': P.mapsKey },
      body: JSON.stringify({ input: q, includedRegionCodes: ['au'], languageCode: 'en-AU', sessionToken: addrToken })
    }).then(function (r) { if (!r.ok) throw new Error('maps ' + r.status); return r.json(); })
      .then(function (d) {
        cb(null, (d.suggestions || []).map(function (s) { return s.placePrediction && s.placePrediction.text && s.placePrediction.text.text; })
          .filter(Boolean).map(function (t) { return t.replace(/,\s*Australia$/, ''); }).slice(0, 5));
      }).catch(function (e) { cb(e); });
  }
  function wireAddress(inp) {
    var key = inp.dataset.ak, list = card.querySelector('[data-al="' + key + '"]'), timer = null, chosen = A[key] || '', seq = 0;
    function close() { list.hidden = true; list.innerHTML = ''; inp.setAttribute('aria-expanded', 'false'); }
    function show(items) {
      list.innerHTML = '';
      if (!items.length) { var n = document.createElement('div'); n.className = 'none'; n.textContent = 'No match yet. Keep typing, or tap "Can\'t find it? Type it in" below.'; list.appendChild(n); }
      items.forEach(function (t) {
        var b = document.createElement('button'); b.type = 'button'; b.textContent = t;
        var pick = function (ev) { ev.preventDefault(); inp.value = t; A[key] = t; chosen = t; delete pre[key]; addrToken = null; close(); saveSoon(); };
        b.addEventListener('mousedown', pick); b.addEventListener('touchstart', pick, { passive: false });
        list.appendChild(b);
      });
      list.hidden = false; inp.setAttribute('aria-expanded', 'true');
    }
    inp.addEventListener('input', function () {
      var q = inp.value.trim();
      if (q !== chosen) { A[key] = ''; delete pre[key]; }
      clearTimeout(timer);
      if (q.length < 3 || q === chosen) { close(); return; }
      var my = ++seq;
      timer = setTimeout(function () {
        fetchAddr(q, function (err, items) {
          if (my !== seq) return;
          if (err) { addrManual[key] = true; var v = inp.value; A[key] = v; render(true); return; }
          show(items);
        });
      }, 250);
    });
    inp.addEventListener('blur', function () { setTimeout(close, 200); });
    inp.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
  }

  function wire() {
    var g = function (s) { return card.querySelector(s); };
    var sc = screens[cur];
    card.querySelectorAll('[data-k]').forEach(function (el) {
      el.addEventListener('input', function () { A[el.dataset.k] = el.value; delete pre[el.dataset.k]; saveSoon(); });
      el.addEventListener('change', function () { A[el.dataset.k] = el.value; saveSoon(); });
    });
    card.querySelectorAll('[data-am]').forEach(function (b) {
      b.addEventListener('click', function () { addrManual[b.dataset.am] = b.dataset.to === '1'; render(true); });
    });
    card.querySelectorAll('[data-ak]').forEach(wireAddress);
    card.querySelectorAll('[data-r]').forEach(function (b) {
      b.addEventListener('click', function () { A[b.dataset.r] = b.dataset.v; saveSoon(); render(true); });
    });
    card.querySelectorAll('[data-c]').forEach(function (c) {
      c.addEventListener('change', function () { A[c.dataset.c] = c.checked; saveSoon(); if (sc.t === 'step') render(true); });
    });
    card.querySelectorAll('[data-a]').forEach(function (b) {
      b.addEventListener('click', function () {
        var arr = A[b.dataset.a], i = arr.indexOf(b.dataset.v);
        if (i >= 0) arr.splice(i, 1); else arr.push(b.dataset.v);
        b.classList.toggle('on');
        var cnt = g('#availCount'); if (cnt) cnt.textContent = arr.length;
      });
    });
    if (g('#back')) g('#back').addEventListener('click', function () { cur--; render(); save(); });
    if (g('#next')) g('#next').addEventListener('click', function () {
      if (sc.t === 'step') {
        var errs = stepErrors(sc.step);
        if (errs.length) { g('#err').textContent = errs[0]; return; }
        if (sc.step.id === 'sign') return submit();
        save();
      }
      cur++; render();
      if (sc.t !== 'step') save();
    });
    var cv = g('#cv');
    if (cv) {
      var r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1;
      cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d);
      var c = cv.getContext('2d'); c.scale(d, d); c.lineWidth = 2.5; c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = '#1F1A17';
      g('#when').textContent = new Date().toLocaleString('en-AU', { timeZone: 'Australia/Sydney', dateStyle: 'medium', timeStyle: 'short' });
      var down = false;
      var pt = function (e) { var b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
      cv.addEventListener('pointerdown', function (e) { down = true; cv.setPointerCapture(e.pointerId); c.beginPath(); var p = pt(e); c.moveTo(p[0], p[1]); });
      cv.addEventListener('pointermove', function (e) { if (!down) return; var p = pt(e); c.lineTo(p[0], p[1]); c.stroke(); strokes++; });
      var keepSig = function () { try { sigPng = cv.toDataURL('image/png'); sessionStorage.setItem('sig_' + token, JSON.stringify({ png: sigPng, strokes: strokes })); } catch (x) {} };
      cv.addEventListener('pointerup', function () { if (down) keepSig(); down = false; });
      cv.addEventListener('pointercancel', function () { if (down) keepSig(); down = false; });
      g('#clr').addEventListener('click', function () { c.clearRect(0, 0, cv.width, cv.height); strokes = 0; sigPng = null; try { sessionStorage.removeItem('sig_' + token); } catch (x) {} });
      // put a signature drawn earlier back in the box (going back a step, or a page reload)
      if (!sigPng) { try { var sv = JSON.parse(sessionStorage.getItem('sig_' + token) || 'null'); if (sv && sv.png) { sigPng = sv.png; strokes = sv.strokes || 8; } } catch (x) {} }
      if (sigPng) { var im = new Image(); im.onload = function () { c.drawImage(im, 0, 0, r.width, r.height); }; im.src = sigPng; }
    }
  }

  function submit() {
    if (submitting) return;
    var errBox = card.querySelector('#err'), btn = card.querySelector('#next'), cv = card.querySelector('#cv');
    // check every earlier step first, so nothing required is missed
    for (var i = 0; i < screens.length; i++) {
      if (screens[i].t !== 'step') continue;
      if (screens[i].step.id === 'sign') continue;
      var e = stepErrors(screens[i].step);
      if (e.length) { cur = i; render(); card.querySelector('#err').textContent = e[0]; return; }
    }
    if (P.preview) {
      // Test preview: show the real next step (the payment page) so a tester can see the whole journey. Nothing is saved.
      if (P.payPreview && (A.pay_method === 'Upfront' || A.pay_method === 'Direct debit')) {
        var up = A.pay_method === 'Upfront', pk = up ? 'plan_upfront' : 'plan_dd', po = null;
        form.steps.forEach(function (st) { st.fields.forEach(function (f) { if (f.key === pk && f.options) po = f.options.filter(function (o) { return o.value === A[pk]; })[0] || po; }); });
        payNext = P.payPreview + (up ? 'pay-upfront.html' : 'pay-dd.html') + '?plan=' + encodeURIComponent(po ? po.label : '') + '&amt=' + encodeURIComponent(po ? (po.price || po.desc || '').replace(/ total$/, '') : '') + '&freq=' + encodeURIComponent(A.dd_frequency || '') + '&day=' + encodeURIComponent(A.dd_day || '') + '&ref=' + encodeURIComponent(String(A.student_name || '').slice(0, 18));
        cur = screens.length - 1; render(); window.scrollTo(0, 0); setTimeout(function () { location.href = payNext; }, 2500); return;
      }
      errBox.textContent = 'This is only a preview. Nothing was saved or sent.'; return;
    }
    submitting = true; btn.disabled = true; btn.textContent = 'Saving...';
    var png = cv.toDataURL('image/png');
    fetch('/enrol/' + token + '/submit', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'payload=' + encodeURIComponent(JSON.stringify({ answers: A, signature: png })) })
      .then(function (r) { return r.json().catch(function () { return { ok: false }; }); })
      .then(function (j) {
        submitting = false;
        if (j.ok) { try { sessionStorage.removeItem('sig_' + token); } catch (x) {} if (j.payUrl) { payNext = j.payUrl; cur = screens.length - 1; render(); window.scrollTo(0, 0); setTimeout(function () { location.href = payNext; }, 4000); return; } if (j.next) { nextForm = { url: j.next, title: j.nextTitle || '' }; } cur = screens.length - 1; render(); if (nextForm) { setTimeout(function () { location.href = nextForm.url; }, 6000); } }
        else { btn.disabled = false; btn.textContent = 'Sign and finish'; errBox.textContent = j.message || 'Something went wrong. Please try again.'; }
      })
      .catch(function () { submitting = false; btn.disabled = false; btn.textContent = 'Sign and finish'; errBox.textContent = 'No connection. Please try again.'; });
  }

  render();
})();
</script>
</body></html>
